      ctx.ellipse(4, -2, 3.5, 4.5, 0.4, 0, Math.PI * 2);
      ctx.ellipse(-3, 4, 2.5, 3.2, 0.4, 0, Math.PI * 2);
      ctx.ellipse(3, 4, 2.5, 3.2, -0.4, 0, Math.PI * 2); ctx.fill();
    } else if (icon === 'tulip') {

      ctx.lineTo(-5, -5); ctx.lineTo(-2, -2); ctx.lineTo(0, -6); ctx.lineTo(2, -2);
      ctx.lineTo(5, -5); ctx.closePath(); ctx.fill();

      ctx.beginPath(); ctx.arc(0, -2, 5, 0, Math.PI * 2); ctx.fill();

        ctx.beginPath(); ctx.moveTo(i * 2.2, 2);
        ctx.quadraticCurveTo(i * 3, 6, i * 2.5, 7); ctx.stroke();

      ctx.arc(0, 0, 2.6, 0, Math.PI * 2); ctx.fill();
    } else if (icon === 'teddy') {
      ctx.beginPath(); ctx.arc(-4.5, -4.5, 2.4, 0, Math.PI * 2);
      ctx.arc(4.5, -4.5, 2.4, 0, Math.PI * 2);
      ctx.arc(0, 1, 5.5, 0, Math.PI * 2); ctx.fill();
    } else if (icon === 'digicam') {

      ctx.arc(1, 0.5, 2.8, 0, Math.PI * 2); ctx.fill(); ctx.fillRect(-5, -6, 3.5, 2);
    } else if (icon === 'monkey') {
      ctx.beginPath(); ctx.arc(-6, 0, 2.2, 0, Math.PI * 2);
      ctx.arc(6, 0, 2.2, 0, Math.PI * 2);
      ctx.arc(0, 0, 5.2, 0, Math.PI * 2); ctx.fill();

      ctx.moveTo(-3.5, -1.5); ctx.lineTo(-1, 1);
      ctx.moveTo(3.5, -1.5); ctx.lineTo(1, 1); ctx.stroke();
    } else if (icon === 'bow') {

      ctx.fillStyle = isDark ? '#FFB3C6' : '#E05780'; ctx.beginPath();

      ctx.bezierCurveTo(9, 3, 7, -7, 0, -1); ctx.fill(); ctx.stroke(); ctx.beginPath();

    } else if (icon === 'cat') {

      ctx.fill(); ctx.beginPath(); ctx.arc(-1, -3.2, 3.2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-3.8, -4.5);
      ctx.lineTo(-3.2, -7.8); ctx.lineTo(-1.2, -5.8);
      ctx.moveTo(1.8, -4.5); ctx.lineTo(1.2, -7.8); ctx.lineTo(-0.8, -5.8); ctx.fill();
      ctx.beginPath(); ctx.moveTo(2.2, 5.5);
      ctx.quadraticCurveTo(6.8, 5.2, 5.8, -0.5); ctx.stroke();
    } else if (icon === 'heart') {

      ctx.fillStyle = isDark ? '#FF9EBB' : '#E05780'; ctx.beginPath();

      ctx.bezierCurveTo(-0.8, -6.0, 0, -4.0, 0, -3.2);
      ctx.bezierCurveTo(0, -4.0, 0.8, -6.0, 2.8, -6.2);

  function drawBlockCell(x, y, s, cellObj, alpha = 1) {
    ctx.save(); ctx.globalAlpha = alpha;
    const pad = 1.6, rx = x + pad, ry = y + pad, rw = s - pad * 2, rh = s - pad * 2;

  function drawShape(p, x, y, s, alpha = 1) {
    p.s.forEach((row, i) => row.forEach((v, j) => {

    }));
  }
  // Dynamic thumb clearance: lifts higher on touch and scales with piece height so her thumb never obscures bottom tiles
  const getLiftOffset = p => {

  };
  const dragXY = p => ({
    x: drag.x - (p.s[0].length * C) / 2,
    y: drag.y - getLiftOffset(p) - (p.s.length * C) / 2

  const target = p => {
    const t = dragXY(p);

  };
  function draw() {
    syncCanvasResolution(); ctx.clearRect(0, 0, W, H);
    const cfg = MODES[currentMode] || MODES.easy; const boardBg = cfg.boardBg;
    const boardBorder = cfg.boardBorder; const cellEmpty = cfg.cellEmpty;
    ctx.fillStyle = boardBg; roundRect(BX - 7, BY - 7, N * C + 14, N * C + 14, 16);
    ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = boardBorder; ctx.stroke();
    let previewClears = { rows: [], cols: [] }; let ghostTarget = null;
    if (drag && hand[drag.i]) {
      const p = hand[drag.i], { r, c } = target(p);

      }
    }
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        const cx = BX + c * C, cy = BY + r * C;

      const sy = TY + 50 - (p.s.length * s) / 2;

  cv.addEventListener('pointercancel', endDrag);
  document.getElementById('ethanRescueBtn').addEventListener('click', useEthansRescue);
  rescueQuickBtn.addEventListener('click', useEthansRescue);
  document.getElementById('freshGameBtn').addEventListener('click', reset);
  document.getElementById('restartQuickBtn').addEventListener('click', reset);
  document.getElementById('backToIndexBtn').addEventListener('click', () => {
    checkAndSaveHighScores(); const targetUrl = ['index', 'html'].join('.') + '#note';
    window.location.assign(targetUrl); });
  const toggleIconsBtn = document.getElementById('toggleIconsBtn');
  toggleIconsBtn.addEventListener('click', () => {

  }); const soundToggleBtn = document.getElementById('soundToggleBtn');
  soundToggleBtn.addEventListener('click', () => {

    if (soundEnabled) playTone('pickup');
  }); const modeBtns = document.querySelectorAll('.mode-btn');
  modeBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      checkAndSaveHighScores(); currentMode = btn.getAttribute('data-mode');
      if (currentMode === 'easy') {
        document.body.removeAttribute('data-mode');
      } else {
        document.body.setAttribute('data-mode', currentMode);
      }
      modeBtns.forEach(b => {
        b.className = 'mode-btn themed-pill flex-1 py-1 rounded-full text-[11px] font-bold';
      });

      reset(); });
  }); window.addEventListener('resize', draw);
