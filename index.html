<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Flor &lt;3 — From Ethan</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Nunito & Caveat for warm, cozy, handwritten-note feel -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Nunito', 'sans-serif'],
                        hand: ['Caveat', 'cursive'],
                    },
                    colors: {
                        cream: '#FFF9F6',
                        blush: '#FFEAEF',
                        roseSoft: '#F4A2B8',
                        roseDeep: '#E05780',
                        berry: '#6D2E46',
                        warmText: '#4A353B',
                    }
                }

        }

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* Allow text selection inside the letter and inputs/textarea on mobile */
        .selectable-text, input, textarea {
            user-select: text;
            -webkit-user-select: text;
        }

        body {
            background: radial-gradient(circle at top, #FFF0F3 0%, #FFF9F6 55%, #FDE8EE 100%);
            min-height: 100vh;
            overflow-x: hidden;
            color: #4A353B;
        }

        /* Uniform Tap Buttons across all widgets */
        .uniform-tap-btn {
            width: 100%;
            min-height: 50px;
            padding: 0.75rem 1.25rem;
            border-radius: 1rem;
            font-size: 0.875rem;
            font-weight: 800;
            line-height: 1.25;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            text-align: center;
            word-break: break-word;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 4px 12px -2px rgba(224, 87, 128, 0.22);
        }

        .uniform-tap-btn:active {
            transform: scale(0.96);
        }

        /* Floating background ambient blobs */
        .ambient-blob {
            position: fixed;
            border-radius: 9999px;
            filter: blur(45px);
            z-index: 0;
            opacity: 0.55;
            pointer-events: none;
            animation: floatAmbient 12s ease-in-out infinite alternate;
        }

        @keyframes floatAmbient {
            0% { transform: translate(0px, 0px) scale(1); }
            100% { transform: translate(15px, -25px) scale(1.08); }
        }

        /* Heart seal pulse animation */
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.14); }
            30% { transform: scale(0.96); }
            45% { transform: scale(1.08); }
        }

        .pulse-heart {
            animation: heartbeat 2.4s infinite ease-in-out;
        }

        /* Standard floating tap particles */
        .floating-particle {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            will-change: transform, opacity;
            animation: floatUpwards var(--duration, 1.8s) cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes floatUpwards {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.4) rotate(0deg);
            }
            25% {
                opacity: 1;
                transform: translate(calc(-50% + var(--drift-x, 12px) * 0.4), calc(-50% - 35px)) scale(var(--scale, 1.15)) rotate(var(--rot-mid, -8deg));
            }
            100% {
                opacity: 0;
                transform: translate(calc(-50% + var(--drift-x, 20px)), calc(-50% - var(--lift, 145px))) scale(0.75) rotate(var(--rot-end, 14deg));
            }
        }

        /* Hug Emoji Variations (Swirl, Giant Screen-Filler, Wave) */
        .hug-swirl-particle {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            will-change: transform, opacity;
            animation: hugSwirlAnim var(--duration, 2.2s) cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes hugSwirlAnim {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.2) rotate(0deg);
            }
            20% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translate(calc(-50% + var(--tx, 100px)), calc(-50% + var(--ty, -150px))) scale(var(--end-scale, 2.6)) rotate(var(--rot, 720deg));
            }
        }

        .hug-mega-center {
            position: fixed;
            left: 50vw;
            top: 50vh;
            pointer-events: none;
            z-index: 9999;
            will-change: transform, opacity;
            animation: hugMegaBoom 2.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes hugMegaBoom {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.1) rotate(-25deg);
            }
            35% {
                opacity: 0.96;
                transform: translate(-50%, -50%) scale(1.15) rotate(8deg);
            }
            65% {
                opacity: 0.9;
                transform: translate(-50%, -50%) scale(1.35) rotate(-5deg);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1.9) rotate(12deg);
            }
        }

        /* Envelope flap styling */
        .envelope-card {
            background: linear-gradient(165deg, #FFFFFF 0%, #FFF4F7 100%);
            box-shadow: 0 18px 40px -12px rgba(224, 87, 128, 0.18), 0 4px 12px -2px rgba(109, 46, 70, 0.06);
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .envelope-card:active {
            transform: scale(0.98);
        }

        /* Smooth letter reveal */
        .letter-reveal {
            animation: unfoldLetter 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            transform-origin: top center;
        }

        @keyframes unfoldLetter {
            0% {
                opacity: 0;
                transform: translateY(18px) scale(0.96);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Reassurance fact card transitions */
        .fact-card {
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .fact-card.affirmed {
            background: linear-gradient(135deg, #FFF0F5 0%, #FFE4EE 100%);
            border-color: #F4A2B8;
            box-shadow: 0 8px 20px -6px rgba(224, 87, 128, 0.22);
        }

        /* Breathing circle animation controlled by JS classes */
        .breath-circle {
            transition: transform 4s ease-in-out, background-color 4s ease-in-out, box-shadow 4s ease-in-out;
        }
        .breath-inhale {
            transform: scale(1.42);
            background-color: #FFD6E4;
            box-shadow: 0 0 35px rgba(244, 162, 184, 0.65);
        }
        .breath-hold {
            transform: scale(1.42);
            background-color: #FFC4D9;
            box-shadow: 0 0 45px rgba(224, 87, 128, 0.75);
        }
        .breath-exhale {
            transform: scale(0.88);
            background-color: #FFEAEF;
            box-shadow: 0 0 15px rgba(244, 162, 184, 0.3);
        }

        /* Calming Vanish ("Poof Away") Animation for Uncontrollable Worries */
        .calm-poof-item {
            animation: calmPoofAway 2.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            pointer-events: none;
        }

        @keyframes calmPoofAway {
            0% {
                opacity: 1;
                filter: blur(0px);
                transform: translateY(0) scale(1);
            }
            45% {
                opacity: 0.65;
                filter: blur(2px);
                transform: translateY(-10px) scale(0.98);
                background-color: #FFF0F5;
            }
            100% {
                opacity: 0;
                filter: blur(10px);
                transform: translateY(-28px) scale(0.88);
            }
        }

        /* Cute Critter Sticker Animations (Beagle & Highland Cow) */
        @keyframes gentleBob {
            0%, 100% { transform: translateY(0px) rotate(var(--base-rot, 0deg)); }
            50% { transform: translateY(-4px) rotate(calc(var(--base-rot, 0deg) + 3deg)); }
        }

        @keyframes critterWiggle {
            0% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.22) rotate(-10deg); }
            50% { transform: scale(1.26) rotate(10deg); }
            75% { transform: scale(1.15) rotate(-6deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        .critter-sticker {
            cursor: pointer;
            transition: filter 0.25s ease;
            animation: gentleBob 4s ease-in-out infinite;
            filter: drop-shadow(0 4px 6px rgba(109, 46, 70, 0.12));
        }

        .critter-sticker:hover {
            filter: drop-shadow(0 6px 10px rgba(224, 87, 128, 0.28));
        }

        .critter-wiggle {
            animation: critterWiggle 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
        }
    </style>
</head>
